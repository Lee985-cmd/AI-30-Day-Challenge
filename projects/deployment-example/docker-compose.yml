version: '3.8'

services:
  api:
    build: .
    container_name: ai-model-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODEL_PATH=./models/cifar_best.pth
      - DEVICE=cpu
    volumes:
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
