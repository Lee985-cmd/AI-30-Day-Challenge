global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 监控示例应用
  - job_name: 'agent-app'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          application: 'agent-monitoring-demo'

  # 监控Prometheus自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
